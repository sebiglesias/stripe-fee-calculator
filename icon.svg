<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="stripeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#stripeBg)"/>
  
  <!-- Credit Card Base -->
  <rect x="96" y="140" width="320" height="200" rx="20" fill="#ffffff" filter="drop-shadow(0 14px 28px rgba(0,0,0,0.25))"/>
  
  <!-- Magnetic Stripe -->
  <rect x="96" y="180" width="320" height="40" fill="#1e1b4b"/>
  
  <!-- Chip -->
  <rect x="135" y="245" width="45" height="35" rx="6" fill="#fbbf24"/>
  <rect x="195" y="255" width="80" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="195" y="270" width="120" height="8" rx="4" fill="#cbd5e1"/>

  <!-- Fee Calculator / Currency Badge -->
  <circle cx="360" cy="355" r="75" fill="#10b981" stroke="#ffffff" stroke-width="10"/>
  <text x="360" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
</svg>
